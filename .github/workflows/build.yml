name: Build MitaPhoneAgent iOS arm64
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native arm64-apple-ios15.0 Mach-O
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK: $SDK"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc -O2 -Wall \
            -framework UIKit \
            -framework Foundation \
            -framework WebKit \
            -framework AVFoundation \
            -framework CoreGraphics \
            main.m AppDelegate.m MainViewController.m \
            MitaConfigStore.m MitaKeepAliveAndControl.m \
            MitaAiGroupEngine.m MitaLanServer.m \
            -o MitaPhoneAgent_arm64
          file MitaPhoneAgent_arm64
          otool -L MitaPhoneAgent_arm64
          ls -lh MitaPhoneAgent_arm64
      - name: Upload Mach-O Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mita-ios-arm64
          path: MitaPhoneAgent_arm64
